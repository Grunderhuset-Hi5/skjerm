name: Build screen data

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # every 15 min, off the busy :00
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/requirements.txt

      - run: pip install -r build/requirements.txt

      # Per-URL lookup cache. Saved under a new key each run; restored from the latest.
      - uses: actions/cache@v4
        with:
          path: build/.cache
          key: media-cache-${{ github.run_id }}
          restore-keys: media-cache-

      - name: Tests
        if: github.event_name != 'schedule'
        run: python -m pytest -q

      - name: app.js must run on the TV (Chromium 63, ES2017)
        if: github.event_name != 'schedule'
        run: npx --yes es-check@8 es2017 app.js

      - name: Build
        run: python build/build.py

      - name: Commit if changed
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update screen data"
          git pull --rebase
          git push
